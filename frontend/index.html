<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="LeadSense brings your pipeline, follow-ups and lead signals into one calm workspace." />
    <meta name="theme-color" content="#f4f6f8" />
    <script>
      (() => {
        try {
          const saved = localStorage.getItem('leadsense_theme') || 'system';
          const dark = saved === 'dark' || (saved === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          document.documentElement.dataset.themeChoice = saved;
        } catch {}
      })();
    </script>
    <title>LeadSense | Lead intelligence workspace</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
